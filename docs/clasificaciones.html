<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clasificaciones · Jose Hub</title>
<style>
:root{--bg:#17142b;--card:#231f3d;--line:#3a3466;--fg:#f4f1ff;--mut:#a9a3cf;--a:#ffb703;--b:#4cc9f0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:900px;margin:0 auto;padding:28px 18px 60px}
h1{margin:0 0 4px;font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:-1px}
.sub{color:var(--mut);margin:0 0 18px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav a{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:7px 14px;text-decoration:none;font-size:14px}
.nav a:hover,.nav a:focus-visible{border-color:var(--a);outline:0}

#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:6px}
.c{display:block;background:var(--card);border:2px solid var(--line);border-top:4px solid var(--a);border-radius:6px 6px 14px 14px;padding:18px;color:var(--fg);text-decoration:none;transition:transform .15s,border-color .15s}
.c:hover,.c:focus-visible{transform:translateY(-4px);border-color:var(--a);outline:0}
.c .i{font-size:40px}.c b{display:block;font-size:20px;margin:6px 0 2px}.c small{display:block;color:var(--mut)}.c em{display:block;margin-top:10px;font-style:normal;color:var(--b);font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){.c{transition:none}}
</style></head><body>
<main>
<h1>🏆 Clasificaciones</h1>
<p class="sub">Elige el juego cuya clasificación quieres ver.</p>
<div class="nav"><a href="index.html" target="_top">← Inicio</a></div>
<div id="g"></div>
</main>
<script>
/* Para añadir otra clasificación: una línea nueva aquí. */
const LBS=[
 {n:'Escapa de JOSE',i:'🏃',d:'Puntos, combos y monedas por dificultad y dispositivo',href:'clasificacion.html'},
 {n:'Escapa de JOSE (original)',i:'🕹️',d:'La versión original, sin dificultades',href:'clasificacion_original.html'},
 {n:'Snake de JOSE',i:'🐍',d:'Puntos, longitud y pizzas por modo y dispositivo',href:'clasificacion_snake.html'}
];
document.getElementById('g').innerHTML=LBS.map(l=>{return `<a class="c" href="${l.href}" target="_top"><span class="i">${l.i}</span><b>${l.n}</b><small>${l.d}</small></a>`}).join('');
</script></body></html>
