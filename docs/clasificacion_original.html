<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clasificación · Escapa de JOSE (Original)</title>
<style>
:root{--bg:#17142b;--card:#231f3d;--line:#3a3466;--fg:#f4f1ff;--mut:#a9a3cf;--a:#ffb703;--b:#4cc9f0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:900px;margin:0 auto;padding:28px 18px 60px}
h1{margin:0 0 4px;font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:-1px}
.sub{color:var(--mut);margin:0 0 18px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav a{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:7px 14px;text-decoration:none;font-size:14px}
.nav a:hover,.nav a:focus-visible{border-color:var(--a);outline:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.row>span{color:var(--mut);font-size:13px;min-width:90px}
.row button{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.row button.on{border-color:var(--a);background:#ffb7031f;color:var(--a);font-weight:700}
.row button:focus-visible{outline:2px solid var(--b)}
.tabs button{font-weight:700;padding:8px 18px}
.wrap{overflow-x:auto;margin-top:14px;background:var(--card);border:2px solid var(--line);border-top:4px solid var(--a);border-radius:6px 6px 14px 14px}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:10px 12px;text-align:left;font-size:15px;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid var(--line)}
th.act{color:var(--a)}
tbody tr:nth-child(odd){background:#ffffff08}
tbody tr:nth-child(-n+3){background:#ffb7031a}
td.rk{font-weight:900;color:var(--a);width:50px;text-align:center}
td.nm{font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis}
td.v{font-variant-numeric:tabular-nums;color:var(--mut)}
td.v.act{font-weight:900;color:var(--b)}
.em{padding:28px 14px;color:var(--mut);text-align:center}
.hint{color:var(--mut);font-size:12.5px;margin-top:10px}
</style></head><body>
<main>
<h1>🏆 Clasificación</h1>
<p class="sub">Escapa de JOSE · versión original (sin dificultades)</p>
<p class="hint" id="st" style="margin:-10px 0 14px"></p>
<div class="nav"><a href="index.html" target="_top">← Inicio</a><a href="games/Escapa_de_JOSE_NO_NERF.html" target="_top">▶ Jugar</a><a href="clasificacion.html" target="_top">Clasificación de la versión con dificultades</a></div>
<div class="row tabs" id="tabs"><span>Ranking</span>
<button data-k="score" class="on">Puntos</button><button data-k="combo">Combo</button><button data-k="coins">Monedas</button></div>
<div class="wrap"><table><thead><tr><th>#</th><th>Jugador</th><th data-c="score">Puntos</th><th data-c="combo">Mejor combo</th><th data-c="coins">Monedas</th></tr></thead><tbody id="tb"></tbody></table></div>
<p class="hint">Cada jugador aparece una vez, con su mejor marca en cada ranking (puntos, combo y monedas).</p>
</main>
<script src="lb-original.js"></script>
<script>
const KEY='jh-lb-escapa-de-jose';
let k='score',ALL=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(s){document.getElementById('st').textContent=s}
async function load(){
 setStatus('Cargando marcas…');
 try{
  const r=await JHLBO.all();ALL=r.list;
  setStatus(!r.enabled?'⚠ Servidor no configurado: solo se ven las marcas de este dispositivo.':r.online?'🌐 Clasificación global (todos los navegadores y dispositivos).':'⚠ Sin conexión con el servidor: se muestran solo las marcas de este dispositivo.');
 }catch(e){ALL=[];setStatus('No se pudieron cargar las marcas.')}
 render();
}
function render(){
 const a=ALL.filter(e=>(+e[k]||0)>0).sort((x,y)=>(y[k]||0)-(x[k]||0)).slice(0,50),med=['🥇','🥈','🥉'];
 document.querySelectorAll('th[data-c]').forEach(th=>th.classList.toggle('act',th.dataset.c===k));
 const c=f=>'v'+(f===k?' act':'');
 document.getElementById('tb').innerHTML=a.length?a.map((e,i)=>`<tr><td class="rk">${med[i]||i+1}</td><td class="nm">${esc(e.name)}</td><td class="${c('score')}">${(+e.score||0).toLocaleString('es')}</td><td class="${c('combo')}">x${+e.combo||0}</td><td class="${c('coins')}">${+e.coins||0}</td></tr>`).join(''):'<tr><td colspan="5" class="em">Aún no hay marcas. ¡Sé el primero!</td></tr>';
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;k=b.dataset.k;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
addEventListener('storage',e=>{if(e.key===KEY)load()});
JHLBO.syncLocal().finally(load);
setInterval(load,30000);
</script></body></html>
