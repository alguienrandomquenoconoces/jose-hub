<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clasificación · Escapa de JOSE</title>
<style>
:root{--bg:#17142b;--card:#231f3d;--line:#3a3466;--fg:#f4f1ff;--mut:#a9a3cf;--a:#ffb703;--b:#4cc9f0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:900px;margin:0 auto;padding:28px 18px 60px}
h1{margin:0 0 4px;font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:-1px}
.sub{color:var(--mut);margin:0 0 18px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.nav a{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:7px 14px;text-decoration:none;font-size:14px}
.nav a:hover,.nav a:focus-visible{border-color:var(--a);outline:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.row>span{color:var(--mut);font-size:13px;min-width:90px}
.row button{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.row button.on{border-color:var(--a);background:#ffb7031f;color:var(--a);font-weight:700}
.row button:focus-visible{outline:2px solid var(--b)}
.tabs button{font-weight:700;padding:8px 18px}
.wrap{overflow-x:auto;margin-top:14px;background:var(--card);border:2px solid var(--line);border-top:4px solid var(--a);border-radius:6px 6px 14px 14px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:10px 12px;text-align:left;font-size:15px;white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid var(--line)}
tbody tr:nth-child(odd){background:#ffffff08}
tbody tr:nth-child(-n+3){background:#ffb7031a}
td.rk{font-weight:900;color:var(--a);width:50px;text-align:center}
td.nm{font-weight:700;max-width:180px;overflow:hidden;text-overflow:ellipsis}
td.v{font-weight:900;color:var(--b);font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#10151a}
.facil{background:#7dff8a}.normal{background:#4cc9f0}.dificil{background:#ffb703}.extremo{background:#ff5c5c}
.em{padding:28px 14px;color:var(--mut);text-align:center}
.hint{color:var(--mut);font-size:12.5px;margin-top:10px}
</style></head><body>
<main>
<h1>🏆 Clasificación</h1>
<p class="sub">Escapa de JOSE · mejores marcas guardadas en este dispositivo</p>
<div class="nav"><a href="index.html" target="_top">← Inicio</a><a href="games/Escapa_de_JOSE.html" target="_top">▶ Jugar</a></div>
<div class="row tabs" id="tabs"><span>Ranking</span>
<button data-k="score" class="on">Puntos</button><button data-k="combo">Combo</button><button data-k="coins">Monedas</button></div>
<div class="row" id="fd"><span>Dificultad</span>
<button data-v="" class="on">Todas</button><button data-v="facil">Fácil</button><button data-v="normal">Normal</button><button data-v="dificil">Difícil</button><button data-v="extremo">Extremo</button></div>
<div class="row" id="fv"><span>Dispositivo</span>
<button data-v="" class="on">Todos</button><button data-v="Teclado">⌨ Teclado</button><button data-v="Mando">🎮 Mando</button></div>
<div class="wrap"><table><thead><tr><th>#</th><th>Jugador</th><th id="vh">Puntos</th><th>Dificultad</th><th>Dispositivo</th><th>Combo</th><th>Monedas</th></tr></thead><tbody id="tb"></tbody></table></div>
<p class="hint">Cada jugador aparece una vez por dificultad y dispositivo, con su mejor marca en cada ranking.</p>
</main>
<script>
const KEY='jh-lb2-escapa-de-jose',DN={facil:'Fácil',normal:'Normal',dificil:'Difícil',extremo:'Extremo'},DI={Teclado:'⌨',Mando:'🎮'},LBL={score:'Puntos',combo:'Combo',coins:'Monedas'};
let k='score',fd='',fv='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function data(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function render(){
 const a=data().filter(e=>(!fd||e.diff===fd)&&(!fv||e.dev===fv)&&(+e[k]||0)>0).sort((x,y)=>(y[k]||0)-(x[k]||0)).slice(0,50),med=['🥇','🥈','🥉'];
 document.getElementById('vh').textContent=LBL[k];
 document.getElementById('tb').innerHTML=a.length?a.map((e,i)=>`<tr><td class="rk">${med[i]||i+1}</td><td class="nm">${esc(e.name)}</td><td class="v">${(+e[k]||0).toLocaleString('es')}</td><td><span class="tag ${DN[e.diff]?e.diff:''}">${esc(DN[e.diff]||e.diff)}</span></td><td>${DI[e.dev]||''} ${esc(e.dev)}</td><td>x${+e.combo||0}</td><td>${+e.coins||0}</td></tr>`).join(''):'<tr><td colspan="7" class="em">Aún no hay marcas con estos filtros. ¡Sé el primero!</td></tr>';
}
function bind(id,fn){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fn(b.dataset.k??b.dataset.v);document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));render()})}
bind('tabs',v=>k=v);bind('fd',v=>fd=v);bind('fv',v=>fv=v);
addEventListener('storage',e=>{if(e.key===KEY)render()});
render();
</script></body></html>
