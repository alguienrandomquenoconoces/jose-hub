const NODES=[[18,0],[10,0],[2,0],[-9,0],[2,-9],[2,9],[14.5,4],[14,11],[14.5,-4],[14,-11]];

const ADJ=NODES.map(()=>[]);EDGES.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});
const A={x:18,z:0,node:0,path:[],st:'wait',wait:8,stun:0,cd:0,bang:0,lost:0,face:Math.PI,ph:0,mv:false,thump:0,stepT:0};
function bfs(a,b){const q=[[a]],seen=new Set([a]);while(q.length){const p=q.shift(),n=p[p.length-1];if(n===b)return p;for(const m of ADJ[n])if(!seen.has(m)){seen.add(m);q.push([...p,m])}}return[a]}
function pickDest(){const go=power<=0||rnd()<AGG[night-1]+wave*.04;let d=go?3:Math.floor(rnd()*NODES.length);if(d===A.node)d=(d+1)%NODES.length;A.path=bfs(A.node,d).slice(1);A.st='move'}
function arrive(){if(A.node===3){if(doorClosed){A.st='bang';A.bang=3+rnd()*3}else{A.st='hunt';A.lost=0}}else{A.st='wait';A.wait=Math.max(1.5,(7-night*.9)*(.6+rnd()*.8))}}
function stepTo(tx,tz,sp,dt){const dx=tx-A.x,dz=tz-A.z,d=Math.hypot(dx,dz);if(d<.05)return 0;const s=Math.min(sp*dt,d);slide(A,dx/d*s,dz/d*s,.5);A.face=Math.atan2(dx,dz);A.mv=true;return Math.hypot(tx-A.x,tz-A.z)}
function nearestNode(){let b=0,bd=1e9;NODES.forEach(([x,z],i)=>{const d=Math.hypot(x-A.x,z-A.z);if(d<bd&&los(A,{x,z})){bd=d;b=i}});return b}
function updateAI(dt){
  A.mv=false;A.cd-=dt;
  const dx=A.x-P.x,dz=A.z-P.z,dist=Math.hypot(dx,dz),inOff=P.x<-12;
  if(light&&A.cd<=0&&dist<13&&A.st!=='bang'){const dot=(-Math.sin(yaw)*dx-Math.cos(yaw)*dz)/dist;if(dot>.95&&los(P,A)){A.stun=2;A.cd=7;noise(.4,.18)}}
  if(A.stun>0){A.stun-=dt;return}
  const sees=dist<(light?10:5)&&los(A,P)&&!(inOff&&doorClosed),sp=2+night*.3;
  if(A.st==='wait'){A.wait-=dt;if(A.wait<=0)pickDest();if(sees){A.st='hunt';A.lost=0}}
  else if(A.st==='move'){const n=NODES[A.path[0]];if(stepTo(n[0],n[1],sp,dt)<.5){A.node=A.path.shift();if(!A.path.length)arrive()}if(sees){A.st='hunt';A.lost=0}}
  else if(A.st==='bang'){A.bang-=dt;A.thump-=dt;if(A.thump<=0){A.thump=1;snd(70,.3,.7,'square',-30);noise(.15,.3)}if(!doorClosed){A.st='hunt';A.lost=0}else if(A.bang<=0){A.st='wait';A.wait=2}}
  else if(A.st==='hunt'){const vis=los(A,P)||(inOff&&!doorClosed&&A.x<-5);if(vis)A.lost=0;else A.lost+=dt;if(power<=0)A.lost=0;stepTo(P.x,P.z,2.4+night*.38+wave*.1,dt);if(A.lost>4||(inOff&&doorClosed)){A.node=nearestNode();A.path=[A.node];A.st='move'}}
  if(dist<1.2&&state==='play')startScare()}
// ---------- audio
let AC;
function snd(f,d,v,type='sine',sl=0){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),AC.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function noise(d,v){if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(rnd()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start()}
function startHum(){if(!AC||startHum.on)return;startHum.on=1;const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=46;g.gain.value=.025;o.connect(g);g.connect(AC.destination);o.start()}
// ---------- NUEVO: fusibles, cuadro eléctrico, la Sombra, aguante
let wave=0,carry=false,stam=100,hb=0;
const FZ=[[-6,0],[2,9],[2,-9],[14,11],[14,-11],[10,0],[-2,6],[-2,-6],[14.5,4],[14.5,-4]];
const brk=new THREE.Mesh(new THREE.BoxGeometry(.5,.7,.15),new THREE.MeshStandardMaterial({color:0xcc9922,emissive:0x331a00}));brk.position.set(-13.2,1.4,3.8);scene.add(brk);
const fuses=[0,1].map(()=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.2,.5,.2),new THREE.MeshStandardMaterial({color:0xffd23a,emissive:0xaa7700,emissiveIntensity:1.2})),l=new THREE.PointLight(0xffd23a,.9,5);m.visible=l.visible=false;scene.add(m,l);return{m,l,x:0,z:0,on:false,rs:0}});
function placeFuse(f){let p;for(let i=0;i<20;i++){p=FZ[Math.floor(rnd()*FZ.length)];if(Math.hypot(p[0]-P.x,p[1]-P.z)>6&&!fuses.some(o=>o!==f&&o.on&&o.x===p[0]&&o.z===p[1]))break}f.x=p[0];f.z=p[1];f.on=true;f.m.visible=f.l.visible=true;f.m.position.set(f.x,.6,f.z);f.l.position.set(f.x,1.2,f.z)}
function tint(g,hex){g.traverse(m=>{if((m.isMesh||m.isInstancedMesh)&&m.material&&m.material.color){m.material=m.material.clone();m.material.color.setHex(hex)}})}
const B={x:0,z:0,on:false,face:0,ph:0,mv:false,stun:0},anim2=buildJose();tint(anim2,0x6f86ff);anim2.visible=false;
function nn(o){let b=0,bd=1e9;NODES.forEach(([x,z],i)=>{const d=Math.hypot(x-o.x,z-o.z);if(d<bd&&los(o,{x,z})){bd=d;b=i}});return b}
function updateB(dt){B.mv=false;const need=night<3?2:1;
 if(!B.on&&wave>=need){let b=NODES[0],bd=0;for(const n of NODES){const d=Math.hypot(n[0]-P.x,n[1]-P.z);if(d>bd){bd=d;b=n}}B.x=b[0];B.z=b[1];B.on=true;B.stun=0;anim2.visible=true;noise(.5,.3);snd(150,1,.3,'sawtooth',-100)}
 if(!B.on)return;
 const dx=B.x-P.x,dz=B.z-P.z,d=Math.hypot(dx,dz)||1,dot=(-Math.sin(yaw)*dx-Math.cos(yaw)*dz)/d,vis=!camMode&&dot>.45&&los(P,B);B.stun-=dt;
 if(light&&!camMode&&dot>.95&&d<12&&vis&&B.stun<=-1){B.stun=2.5;slide(B,dx/d*4,dz/d*4,.5);noise(.3,.2)}
 if(vis)B.face=Math.atan2(-dx,-dz);
 else if(B.stun<=0){const sp=2.4+night*.3+wave*.1;let tx=P.x,tz=P.z;if(!los(B,P)){const a=bfs(nn(B),nn(P)),n=NODES[a.length>1?a[1]:a[0]];tx=n[0];tz=n[1]}
  const ex=tx-B.x,ez=tz-B.z,ed=Math.hypot(ex,ez)||1;slide(B,ex/ed*sp*dt,ez/ed*sp*dt,.5);B.face=Math.atan2(ex,ez);B.mv=true}
 B.ph+=dt*(B.mv?5:0);anim2.position.set(B.x,B.mv?Math.abs(Math.sin(B.ph))*.05:0,B.z);let q=B.face-anim2.rotation.y;q=Math.atan2(Math.sin(q),Math.cos(q));anim2.rotation.y+=q*Math.min(1,dt*8);
 const sw=B.mv?Math.sin(B.ph)*.7:0,u=anim2.userData;u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;u.arms[0].rotation.x=-sw*.8;u.arms[1].rotation.x=sw*.8;
 if(d<1.1&&state==='play')startScare()}
function extra(dt){
 const run=K.ShiftLeft||K.ShiftRight;stam=Math.min(100,stam+(run?(stam<=3?6:0):16)*dt);
 const dd=Math.min(Math.hypot(A.x-P.x,A.z-P.z),B.on?Math.hypot(B.x-P.x,B.z-P.z):99);
 hb-=dt;if(dd<10&&hb<=0){hb=.35+dd*.07;snd(55,.14,.55*(1-dd/10))}
 for(const f of fuses){if(f.on){f.m.rotation.y+=dt*2;f.m.position.y=.6+Math.sin(t*3+f.x)*.08;if(!carry&&Math.hypot(f.x-P.x,f.z-P.z)<1.3){carry=true;f.on=false;f.m.visible=f.l.visible=false;f.rs=7+rnd()*8;snd(1100,.15,.2,'triangle',400)}}
  else{f.rs-=dt;if(f.rs<=0)placeFuse(f)}}}
// ---------- cámaras
const CAMS=[['CAM 1 · ESCENARIO',[6,3.7,-6],[18,1.6,0]],['CAM 2 · COMEDOR',[-11,3.7,13],[4,.6,-2]],['CAM 3 · COCINA',[19,3.7,14],[11,.8,9]],['CAM 4 · ALMACÉN',[19,3.7,-14],[11,.8,-10]],['CAM 5 · PASILLO',[-3,3.7,-13],[-9,1,0]]];
function setCam(on){camMode=on;$('crt').style.display=$('cl').style.display=on?'block':'none';renderer.domElement.style.filter=on?'grayscale(.5) contrast(1.25) brightness(1.5) sepia(.5) hue-rotate(70deg) saturate(1.6)':'';$('dot').style.display=on?'none':'block';if(on)light=false}
// ---------- control
const K={};
addEventListener('keydown',e=>{K[e.code]=1;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(state!=='play')return;
  if(e.code==='KeyC'||e.code==='Space')setCam(!camMode);
  if(/^Digit[1-5]$/.test(e.code)){camIdx=+e.code[5]-1;if(!camMode)setCam(true)}
  if(camMode&&e.code==='KeyD')camIdx=(camIdx+1)%5;if(camMode&&e.code==='KeyA')camIdx=(camIdx+4)%5;
  if(camMode)return;
  if(e.code==='KeyF'&&power>0){light=!light;snd(900,.05,.1,'square')}
  if(e.code==='KeyE'&&carry&&Math.hypot(P.x+13.2,P.z-3.8)<2.8){carry=false;power=100;wave++;snd(200,.5,.4,'square',300);noise(.3,.25)}
  if(e.code==='KeyE'&&Math.hypot(P.x+13.2,P.z+3.8)<3.2){if(doorClosed)doorClosed=false;else if(power>0)doorClosed=true;snd(120,.3,.4,'square',-60);doorM.visible=doorClosed}});
addEventListener('keyup',e=>K[e.code]=0);addEventListener('blur',()=>{if(state==='play')pause()});
addEventListener('mousemove',e=>{if(state!=='play'||camMode)return;if(locked||dragging){yaw-=e.movementX*.0022;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0022))}});
addEventListener('mousedown',()=>dragging=true);addEventListener('mouseup',()=>dragging=false);
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;if(!locked&&state==='play'&&usePL)pause()});
document.addEventListener('pointerlockerror',()=>usePL=false);
function lock(){try{const r=renderer.domElement.requestPointerLock();if(r&&r.catch)r.catch(()=>usePL=false)}catch(_){usePL=false}}
function showOv(h,p,b,fn){$('ov').style.display='flex';$('ov').querySelector('h1').textContent=h;$('ovt').innerHTML=p;$('ovb').textContent=b;$('ovb').onclick=fn}
const HELP='<b>FUSIBLES:</b> recoge los cubos amarillos y cámbialos en el cuadro eléctrico (junto a la oficina, lado contrario a la puerta) para recargar la energía. Cada cambio despierta algo más: la Sombra azul solo se mueve cuando no la miras; enfócala con la linterna para empujarla atrás.<br><br><kbd>WASD</kbd> moverte · <kbd>Shift</kbd> correr · <kbd>Ratón</kbd> o flechas para mirar<br><kbd>F</kbd> linterna · <kbd>E</kbd> puerta de la oficina (junto al panel)<br><kbd>C</kbd>/<kbd>Espacio</kbd> cámaras · <kbd>1-5</kbd> o <kbd>A/D</kbd> cambiar cámara<br>Sobrevive de 12 AM a 6 AM. Si lo enfocas con la linterna se paraliza un instante. Las cámaras, la linterna y la puerta gastan energía; si se acaba, José vendrá a por ti.';
function pause(){state='pause';showOv('PAUSA',HELP,'Continuar',()=>{$('ov').style.display='none';state='play';lock()})}
function startNight(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();startHum();
  t=0;power=100;light=false;doorClosed=false;doorM.visible=false;setCam(false);P.x=-17;P.z=0;yaw=-Math.PI/2;pitch=0;
  A.x=18;A.z=0;A.node=0;A.path=[];A.st='wait';A.wait=Math.max(4,12-night*2);A.stun=0;A.cd=0;anim.scale.setScalar(S);wave=0;carry=false;stam=100;hb=0;B.on=false;anim2.visible=false;placeFuse(fuses[0]);placeFuse(fuses[1]);
  $('red').style.opacity=0;$('ov').style.display='none';state='play';lock()}
function win(){state='win';setCam(false);document.exitPointerLock&&document.exitPointerLock();snd(880,.6,.3);snd(1320,1,.3);
  showOv('6:00 AM','Sobreviviste a la noche '+night+'.<br>'+(night<5?'José será más rápido la próxima noche.':'Has completado las 5 noches. ¡Leyenda!'),night<5?'Noche '+(night+1):'Jugar de nuevo',()=>{night=night<5?night+1:1;try{localStorage.fjn=night}catch(e){}startNight()})}
function startScare(){state='scare';sT=0;light=false;setCam(false);document.exitPointerLock&&document.exitPointerLock();noise(1.4,.8);snd(300,1.2,.5,'sawtooth',-220);snd(90,1.2,.6,'square',-30)}
function scare(dt){sT+=dt;const d=Math.max(.6,1.5-sT*.9),k=S*(1+sT*.2);
  anim.position.set(P.x-Math.sin(yaw)*d,0,P.z-Math.cos(yaw)*d);anim.rotation.y=yaw;anim.scale.setScalar(k);
  cam.rotation.x=Math.atan2(3.1*k-1.65,d)*.95+(rnd()-.5)*.05;cam.rotation.y=yaw+(rnd()-.5)*.08;
  $('red').style.opacity=rnd()<.5?.35:.05;
  if(sT>1.7){state='over';showOv('TE ATRAPÓ','José te encontró en la noche '+night+'.','Reintentar noche '+night,startNight)}}
// ---------- bucle
function update(dt){
  t+=dt;if(t>=6*HOUR){win();return}
  const dead=power<=0;
  if(!camMode){
    yaw+=((K.ArrowLeft?1:0)-(K.ArrowRight?1:0))*1.8*dt;pitch=Math.max(-1.2,Math.min(1.2,pitch+((K.ArrowUp?1:0)-(K.ArrowDown?1:0))*1.2*dt))}
  const fx=camMode?0:(K.KeyW?1:0)-(K.KeyS?1:0),rx=camMode?0:(K.KeyD?1:0)-(K.KeyA?1:0),n=Math.hypot(fx,rx);
  if(n){const run=(K.ShiftLeft||K.ShiftRight)&&stam>3;if(run)stam-=24*dt;const sp=(run?5.2:3.2)*dt/n;slide(P,(-Math.sin(yaw)*fx+Math.cos(yaw)*rx)*sp,(-Math.cos(yaw)*fx-Math.sin(yaw)*rx)*sp,.4)}

  if(power<=0){power=0;if(light||doorClosed){light=false;doorClosed=false;doorM.visible=false;snd(60,1.2,.5,'sawtooth',-30)}if(camMode)setCam(false);amb.intensity=.1;lamps.forEach(x=>x.intensity=0)}
  else{amb.intensity=camMode?.9:.5;lamps.forEach(x=>x.intensity=(camMode?.8:.55)+rnd()*.15*(rnd()<.02?-4:1))}
  updateAI(dt);updateB(dt);extra(dt);
  cam.position.set(P.x,1.65+(n?Math.sin(t*9)*.03:0),P.z);cam.rotation.set(pitch,yaw,0);
  const f=new THREE.Vector3(0,0,-1).applyEuler(cam.rotation);
  spot.position.copy(cam.position);spot.target.position.copy(cam.position).add(f.multiplyScalar(5));spot.intensity=light?3*(.92+rnd()*.08):0;
  A.ph+=dt*(A.mv?(A.st==='hunt'?9:4.5):0);const u=anim.userData,hunting=A.st==='hunt';
  anim.position.set(A.x+(A.stun>0?(rnd()-.5)*.05:0),A.mv?Math.abs(Math.sin(A.ph))*.05:0,A.z);
  let d=A.face-anim.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));anim.rotation.y+=d*Math.min(1,dt*6);
  const sw=A.mv?Math.sin(A.ph)*.7:0;u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;u.arms[0].rotation.x=hunting?-1.3:-sw*.8;u.arms[1].rotation.x=hunting?-1.3:sw*.8;
  u.head.rotation.y=Math.sin(t*1.3)*.3*(A.mv?0:1);u.eyeL.intensity=A.stun>0?(rnd()<.5?0:1):.7;
  if(A.mv){A.stepT-=dt;if(A.stepT<=0){A.stepT=hunting?.28:.55;const dd=Math.hypot(A.x-P.x,A.z-P.z);snd(55,.22,Math.max(0,1-dd/18)*.9)}}
  const h=Math.floor(t/HOUR);$('tl').textContent='Noche '+night+' — '+(h===0?12:h)+' AM';
  $('pw').textContent='Energía: '+Math.ceil(power)+'%'+(carry?' · fusible en mano':'')+' · Aguante '+Math.ceil(stam)+'%';const b=$('bar').firstChild;b.style.width=power+'%';b.style.background=power<25?'#d33':'#4c4';
  const dd=Math.hypot(A.x-P.x,A.z-P.z);$('vig').style.opacity=camMode?0:Math.max(0,(9-dd)/9)*(hunting?1:.5);
  const np=Math.hypot(P.x+13.2,P.z+3.8)<3.2;
  $('hint').textContent=dead&&!carry?'SIN ENERGÍA… busca un fusible':camMode?'C: cerrar cámaras':Math.hypot(P.x+13.2,P.z-3.8)<2.8?(carry?'E: cambiar el fusible del cuadro':'Necesitas un fusible: busca los cubos amarillos'):np?'E: '+(doorClosed?'abrir':'cerrar')+' puerta':(A.st==='bang'?'Algo golpea la puerta…':'');
  panel.material.color.setHex(doorClosed?0xcc2222:0x22cc22);panel.material.emissive.setHex(doorClosed?0x661111:0x116611);
  if(camMode){const c=CAMS[camIdx];cam2.position.set(...c[1]);cam2.lookAt(c[2][0]+Math.sin(t*.4)*2,c[2][1],c[2][2]+Math.cos(t*.4)*1.5);
    $('cl').innerHTML=c[0]+' <span style="color:#f33">'+(Math.floor(t*2)%2?'● REC':'')+'</span>';
    const dc=Math.hypot(A.x-c[2][0],A.z-c[2][2]);$('stat').style.opacity=Math.min(.7,(A.st==='hunt'||dc<5?.25:.04)+rnd()*.08)}
}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(state==='play')update(dt);else if(state==='scare')scare(dt);renderer.render(scene,camMode&&state==='play'?cam2:cam)}
cam.position.set(P.x,1.65,P.z);cam.rotation.set(0,yaw,0);
try{night=Math.min(5,Math.max(1,+localStorage.fjn||1))}catch(e){}
showOv('JOSÉ','Pizzaplex Ruin. Cinco noches, un único animatrónico… y no se parece en nada a los demás.<br><br>'+HELP,'Empezar noche '+night,startNight);
requestAnimationFrame(loop);
