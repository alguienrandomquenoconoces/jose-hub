<style>
:root{--bg:#17142b;--card:#231f3d;--line:#3a3466;--fg:#f4f1ff;--mut:#a9a3cf;--a:#ffb703;--b:#4cc9f0;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
#menu,#gm{max-width:760px;margin:0 auto;padding:18px 0 40px}
h1{margin:0;font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:-1px;display:flex;gap:12px;align-items:center}
h1 img{width:52px;height:52px;border-radius:50%;border:3px solid var(--a)}
.sub{color:var(--mut);margin:6px 0 16px}
#modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}
.m{text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:6px 6px 14px 14px;border-top:4px solid var(--a);padding:10px 12px;font:inherit;cursor:pointer}
.m small{display:block;color:var(--mut);margin:2px 0 6px;font-size:13px}.m i{font-style:normal;color:var(--b);font-size:13px;font-weight:700}
.m.on,.m:hover,.m:focus-visible{border-color:var(--a);background:#ffb7031a;outline:0}
#cu{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
#cu label{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;align-items:center;font-size:14px}#cu label.ck{grid-template-columns:auto 1fr}
#nm{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:9px 16px;font:inherit}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.p,.bt a,.hb button{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;font-size:14px}
button.pri{background:#ffb7031f;border-color:var(--a);color:var(--a)}
button.p:hover,.bt a:hover,.hb button:hover{border-color:var(--a)}
.hb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-variant-numeric:tabular-nums}
.hb span{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:5px 10px;font-size:14px}.hb b{color:var(--a)}
.hb .sp{flex:1;background:0;border:0}
#bx{position:relative;width:min(100%,calc(100vh - 120px),calc(100dvh - 120px));margin:0 auto}
#cv{width:100%;aspect-ratio:1;display:block;border:3px solid var(--line);border-radius:10px;touch-action:none;background:#120f24}
#ov{position:absolute;inset:0;background:#0009;border-radius:10px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;text-align:center;padding:14px}
#ov h2{margin:0;font-size:30px}#ov p{margin:0;color:var(--mut)}#ov .bt{justify-content:center}
